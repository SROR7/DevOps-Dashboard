name: Dashboard CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Check Docker secrets
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME is EMPTY"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "DOCKER_PASSWORD is EMPTY"
            exit 1
          fi

          echo "Docker credentials are configured"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build \
            -t "sror/devops-db-frontend:latest" \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push "sror/devops-db-frontend:latest"

      - name: Build Backend Image
        run: |
          docker build \
            -t "sror/devops-db-backend:latest" \
            ./backend

      - name: Push Backend Image
        run: |
          docker push "sror/devops-db-backend:latest"